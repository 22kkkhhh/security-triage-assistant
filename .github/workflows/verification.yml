name: Verification

on:
  push:
    branches:
      - "agent/**"
      - "integration/**"
      - "main"
  pull_request:
    branches:
      - "integration/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:./prisma/ci.db
      BETTER_AUTH_SECRET: ci-test-only-not-a-production-secret-2026
      BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: []
    steps:
      - uses: actions/checkout@v4
      - name: Docker production smoke
        run: bash scripts/ci-docker-smoke.sh
